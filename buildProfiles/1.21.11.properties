# RealtimeSync build profile for Minecraft 1.21.11
# One profile targets one exact Minecraft version.
minecraft_version=1.21.11
minecraft_compat_label=1.21.11
minecraft_version_range_fabric=>=1.21.11 <1.21.12
minecraft_version_range_mods_toml=[1.21.11,1.21.12)
java_version=21
curseforge_java_versions=Java 21

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is pinned to an exact artifact to keep CI and releases reproducible.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.141.3+1.21.11

# Forge build
forge_version=61.1.5
forge_loader_version=[61,)

# NeoForge build
neoforge_version=21.11.0-beta
neoforge_loader_version=[1,)
neoforge_version_range=[21.11,)
