# RealtimeSync build profile for Minecraft 1.21
# One profile targets one exact Minecraft version.
minecraft_version=1.21
minecraft_compat_label=1.21
minecraft_version_range_fabric=>=1.21 <1.21.1
minecraft_version_range_mods_toml=[1.21,1.21.1)
java_version=21
curseforge_java_versions=Java 21

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is resolved dynamically but rejected unless the resolved version ends with +1.21.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.+

# Forge build
forge_version=51.0.33
forge_loader_version=[51,)

# NeoForge build
neoforge_version=21.0.+
neoforge_loader_version=[21.0,)
