# RealtimeSync build profile for Minecraft 26.1.1
# One profile targets one exact Minecraft version.
# Minecraft 26.1.x uses Java 25 for the Gradle/toolchain runtime.
minecraft_version=26.1.1
minecraft_compat_label=26.1.1
minecraft_runtime_min_version=26.1.1
minecraft_runtime_max_version=26.1.2
minecraft_accept_beta=true
java_version=25
curseforge_java_versions=Java 25

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# 26.1.x is distributed in the official namespace, so Fabric/Quilt use Fabric Loom without remapping.
fabric_loader_version=0.19.2
loader_version=0.19.2
fabric_version=0.145.4+26.1.1

# Forge build
forge_version=63.0.2
forge_loader_version=[63,)

# NeoForge build
neoforge_version=26.1.1.15-beta
neoforge_loader_version=[1,)
neoforge_runtime_min_version=26.1.1
neoforge_accept_beta=true
