# RealtimeSync build profile for Minecraft 1.21.2
# One profile targets one exact Minecraft version.
minecraft_version=1.21.2
minecraft_compat_label=1.21.2
minecraft_version_range_fabric=>=1.21.2 <1.21.3
minecraft_version_range_mods_toml=[1.21.2,1.21.3)
java_version=21
curseforge_java_versions=Java 21

# Loader switches. Forge is disabled for this profile because no matching official Forge 1.21.2 artifact is available.
enable_fabric=true
enable_quilt=true
enable_forge=false
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is resolved dynamically but rejected unless the resolved version ends with +1.21.2.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.+

# Forge build
forge_version=unsupported
forge_loader_version=[53,)

# NeoForge build
neoforge_version=21.2.0-beta
neoforge_loader_version=[21.2,)
