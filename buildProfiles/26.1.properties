# RealtimeSync build profile for Minecraft 26.1
# One profile targets one exact Minecraft version.
# Minecraft 26.1.x requires Java 25 for the Gradle/toolchain runtime.
minecraft_version=26.1
minecraft_compat_label=26.1
minecraft_version_range_fabric=>=26.1 <26.1.1
minecraft_version_range_mods_toml=[26.1,26.1.1)
java_version=25
curseforge_java_versions=Java 25

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
fabric_loader_version=0.19.2
loader_version=0.19.2
fabric_version=0.145.1+26.1

# Forge build
forge_version=62.0.9
forge_loader_version=[62,)

# NeoForge build
neoforge_version=26.1.0.19-beta
neoforge_loader_version=[1,)
neoforge_version_range=[26.1,)
