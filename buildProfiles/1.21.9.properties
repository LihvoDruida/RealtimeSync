# RealtimeSync build profile for Minecraft 1.21.9
# One profile targets one exact Minecraft version.
minecraft_version=1.21.9
minecraft_compat_label=1.21.9
minecraft_version_range_fabric=>=1.21.9 <1.21.10
minecraft_version_range_mods_toml=[1.21.9,1.21.10)
java_version=21
curseforge_java_versions=Java 21

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is pinned to an exact artifact to keep CI and releases reproducible.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.134.1+1.21.9

# Forge build
forge_version=59.0.5
forge_loader_version=[59,)

# NeoForge build
neoforge_version=21.9.9-beta
neoforge_loader_version=[1,)
neoforge_version_range=[21.9,)
