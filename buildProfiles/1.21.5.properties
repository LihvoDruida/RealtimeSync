# RealtimeSync build profile for Minecraft 1.21.5
# One profile targets one exact Minecraft version.
minecraft_version=1.21.5
minecraft_compat_label=1.21.5
minecraft_version_range_fabric=>=1.21.5 <1.21.6
minecraft_version_range_mods_toml=[1.21.5,1.21.6)
java_version=21
curseforge_java_versions=Java 21

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is resolved dynamically but rejected unless the resolved version ends with +1.21.5.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.+

# Forge build
forge_version=55.1.10
forge_loader_version=[55,)

# NeoForge build
neoforge_version=21.5.95
neoforge_loader_version=[21.5,)
