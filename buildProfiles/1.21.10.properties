# RealtimeSync build profile for Minecraft 1.21.10
# One profile targets one exact Minecraft version.
minecraft_version=1.21.10
minecraft_compat_label=1.21.10
minecraft_version_range_fabric=>=1.21.10 <1.21.11
minecraft_version_range_mods_toml=[1.21.10,1.21.11)
java_version=21
curseforge_java_versions=Java 21

# Loader switches.
enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible builds
# Fabric API is pinned to an exact artifact to keep CI and releases reproducible.
fabric_loader_version=0.18.4
loader_version=0.18.4
fabric_version=0.138.4+1.21.10

# Forge build
# 60.1.0 is the official recommended Forge line for 1.21.10; 60.1.9 can fail during ForgeGradle Mavenizer source recompilation on GitHub runners.
forge_version=60.1.0
forge_loader_version=[60,)

# NeoForge build
neoforge_version=21.10.48-beta
neoforge_loader_version=[21.10,)
