plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('quilt')) {
    logger.lifecycle("Skipping :quilt: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.fabricmc.fabric-loom-remap'

def archiveBaseName = "${archives_base_name}-quilt-${minecraft_version}"
def resourceValues = [
        version: version.toString(),
        loader: 'quilt-compatible',
        loader_version: loader_version.toString(),
        fabric_version: fabric_version.toString(),
        minecraft_version_range_fabric: minecraft_version_range_fabric.toString(),
        java_version: java_version.toString()
]
def licenseArchiveName = "LICENSE_${archiveBaseName}"

base {
    archivesName = archiveBaseName
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))
sourceSets.main.java.srcDir(rootProject.file('fabric/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('fabric/src/main/resources'))

configurations.configureEach {
    resolutionStrategy.componentSelection {
        all { selection ->
            if (selection.candidate.group == 'net.fabricmc.fabric-api' && selection.candidate.module == 'fabric-api') {
                String requiredSuffix = "+${minecraft_version}"
                if (!selection.candidate.version.endsWith(requiredSuffix)) {
                    selection.reject("Fabric API must match Minecraft ${minecraft_version}")
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

tasks.named('processResources', ProcessResources) {
    inputs.properties resourceValues
    filesMatching('fabric.mod.json') {
        expand(resourceValues)
    }
    filesMatching('realtime-build.properties') {
        expand(resourceValues)
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { licenseArchiveName }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archiveBaseName
            from components.java
        }
    }
}
