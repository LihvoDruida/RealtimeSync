plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('neoforge')) {
    logger.lifecycle("Skipping :neoforge: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.neoforged.moddev'

if (!hasProperty('neoforge_version_range') || neoforge_version_range.toString().trim().isEmpty()) {
    throw new GradleException("Missing required neoforge_version_range for Minecraft ${minecraft_version}; do not reuse javafml loaderVersion for the NeoForge runtime dependency.")
}

def archiveBaseName = "${archives_base_name}-neoforge-${minecraft_version}"
def resourceValues = [
        version: version.toString(),
        neoforge_version_range: neoforge_version_range.toString(),
        minecraft_version_range: minecraft_version_range_mods_toml.toString()
]
def licenseArchiveName = "LICENSE_${archiveBaseName}"

base {
    archivesName = archiveBaseName
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

neoForge {
    version = neoforge_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        realtime { sourceSet sourceSets.main }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.properties resourceValues
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(resourceValues)
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { licenseArchiveName }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archiveBaseName
            from components.java
        }
    }
}
