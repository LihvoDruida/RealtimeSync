plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('neoforge')) {
    logger.lifecycle("Skipping :neoforge: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.neoforged.moddev'

base {
    archivesName = "${project.archives_base_name}-neoforge-${project.minecraft_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        realtime {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def neoforgeDependencyVersionRange = project.hasProperty('neoforge_version_range')
            ? project.neoforge_version_range
            : project.neoforge_loader_version

    inputs.property 'version', project.version
    inputs.property 'neoforge_loader_version', project.neoforge_loader_version
    inputs.property 'neoforge_version_range', neoforgeDependencyVersionRange
    inputs.property 'minecraft_version_range_mods_toml', project.minecraft_version_range_mods_toml
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                neoforge_loader_version: project.neoforge_loader_version,
                neoforge_version_range: neoforgeDependencyVersionRange,
                minecraft_version_range: project.minecraft_version_range_mods_toml
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
