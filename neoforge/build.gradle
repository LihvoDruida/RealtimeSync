plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('neoforge')) {
    logger.lifecycle("Skipping :neoforge: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.neoforged.moddev'

base {
    archivesName = "${project.archives_base_name}-neoforge-${project.minecraft_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        realtime {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    String resolvedNeoForgeVersionRange = rootProject.ext.resolveNeoForgeVersionRange()
    String resolvedMinecraftVersionRangeModsToml = rootProject.ext.resolveMinecraftVersionRangeModsToml()
    if (resolvedNeoForgeVersionRange.trim().isEmpty()) {
        throw new GradleException("Missing required NeoForge runtime version range for Minecraft ${project.minecraft_version}; set neoforge_runtime_min_version or neoforge_version_range, and do not reuse javafml loaderVersion for the NeoForge runtime dependency.")
    }

    inputs.property 'version', project.version
    inputs.property 'neoforge_version_range', resolvedNeoForgeVersionRange
    inputs.property 'minecraft_version_range_mods_toml', resolvedMinecraftVersionRangeModsToml
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                neoforge_version_range: resolvedNeoForgeVersionRange,
                minecraft_version_range: resolvedMinecraftVersionRangeModsToml
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
