# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Default build profile. Override with: ./gradlew -PmcProfile=26.1.2 buildAllLoaders
mcProfile=26.1.2

# Fallback values mirror buildProfiles/26.1.2.properties for tooling only.
# Gradle fails when mcProfile does not point to an explicit buildProfiles/<mcProfile>.properties file.
minecraft_version=26.1.2
minecraft_compat_label=26.1.2
minecraft_runtime_min_version=26.1.2
minecraft_runtime_max_version=26.1.3
minecraft_accept_beta=true
java_version=25
curseforge_java_versions=Java 25

enable_fabric=true
enable_quilt=true
enable_forge=true
enable_neoforge=true

# Fabric / Quilt-compatible build
fabric_loader_version=0.19.2
loader_version=0.19.2
fabric_version=0.145.4+26.1.2

# Forge build
forge_version=64.0.8
forge_loader_version=[64,)

# NeoForge build
neoforge_version=26.1.2.48-beta
neoforge_loader_version=[1,)
neoforge_runtime_min_version=26.1.2
neoforge_accept_beta=true

# Mod Properties
mod_version=0.0.0-dev
maven_group=com.realtime
archives_base_name=realtime-sync

# CurseForge publication
curseforge_game_versions_file=curseforge-game-versions.txt
