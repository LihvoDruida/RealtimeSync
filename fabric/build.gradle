plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('fabric')) {
    logger.lifecycle("Skipping :fabric: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.fabricmc.fabric-loom'

base {
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

configurations.configureEach {
    resolutionStrategy.componentSelection {
        all { selection ->
            if (selection.candidate.group == 'net.fabricmc.fabric-api' && selection.candidate.module == 'fabric-api') {
                String requiredSuffix = "+${project.minecraft_version}"
                if (!selection.candidate.version.endsWith(requiredSuffix)) {
                    selection.reject("Fabric API must match Minecraft ${project.minecraft_version}")
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.1.x is distributed in the official namespace. Do not add
    // remap-only dependency paths are intentionally not used here.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_version', project.fabric_version
    inputs.property 'minecraft_version_range_fabric', project.minecraft_version_range_fabric
    inputs.property 'java_version', project.java_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                loader_version: project.loader_version,
                fabric_version: project.fabric_version,
                minecraft_version_range_fabric: project.minecraft_version_range_fabric,
                java_version: project.java_version
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
