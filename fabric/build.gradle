plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('fabric')) {
    logger.lifecycle("Skipping :fabric: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

def isMinecraft26Plus = project.minecraft_version.toString().startsWith('26.')
apply plugin: isMinecraft26Plus ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

base {
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

configurations.configureEach {
    resolutionStrategy.componentSelection {
        all { selection ->
            if (selection.candidate.group == 'net.fabricmc.fabric-api' && selection.candidate.module == 'fabric-api') {
                String requiredSuffix = "+${project.minecraft_version}"
                if (!selection.candidate.version.endsWith(requiredSuffix)) {
                    selection.reject("Fabric API must match Minecraft ${project.minecraft_version}")
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (isMinecraft26Plus) {
        // Minecraft 26.x is distributed in the official namespace. Fabric's 26.1
        // porting guide explicitly says to remove the mappings dependency and
        // to use standard Gradle configurations instead of modImplementation.
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        // Minecraft 1.21.x still needs Loom to remap Fabric API onto Mojang's
        // official mappings, so keep the remap plugin and explicit mappings.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'minecraft_version_range_fabric', project.minecraft_version_range_fabric
    inputs.property 'java_version', project.java_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                loader_version: project.loader_version,
                minecraft_version_range_fabric: project.minecraft_version_range_fabric,
                java_version: project.java_version
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
