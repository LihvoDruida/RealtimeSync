name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: realtime-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate compatibility lock and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle wrapper executable bit
        shell: bash
        run: |
          chmod +x ./gradlew
          git update-index --chmod=+x ./gradlew || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Remove transient Python caches
        shell: bash
        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate source tree cleanliness
        shell: bash
        run: python3 -B scripts/validate-source-tree.py

      - name: Validate build profiles against compatibility lock
        shell: bash
        run: python3 -B scripts/validate-build-profiles.py

      - name: Validate entrypoints and loader metadata
        shell: bash
        run: python3 -B scripts/validate-entrypoints.py

      - name: Validate Forge EventBus API boundaries
        shell: bash
        run: python3 -B scripts/validate-forge-event-api.py

      - name: Validate Gradle resource template expansion
        shell: bash
        run: python3 -B scripts/validate-resource-expansion.py

      - name: Validate dependency coordinates offline
        shell: bash
        run: python3 -B scripts/validate-dependency-artifacts.py

      - name: Run core unit tests
        shell: bash
        run: bash scripts/run-core-tests.sh

      - name: Verify build matrix guardrails
        shell: bash
        run: bash scripts/verify-build-matrix.sh

  prepare-matrix:
    name: Generate supported loader matrix
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate matrix from compatibility lock
        id: matrix
        shell: bash
        run: python3 -B scripts/generate-ci-matrix.py --github-output

  build-loader:
    name: Build ${{ matrix.loader }} for Minecraft ${{ matrix.mc_profile }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.has_entries == 'true' }}
    env:
      TARGET_LOADER: ${{ matrix.loader }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle wrapper executable bit
        shell: bash
        run: |
          chmod +x ./gradlew
          git update-index --chmod=+x ./gradlew || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve release version from tag
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only supports v* tag builds. Current ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
            exit 1
          fi

          MOD_VERSION="${TAG#v}"
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "Could not resolve mod version. Expected tag format like v1.5.5" >&2
            exit 1
          fi

          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "MOD_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved mod version: ${MOD_VERSION}"

      - name: Read selected build profile and loader
        id: versions
        shell: bash
        run: bash scripts/ci-read-profile.sh '${{ matrix.mc_profile }}' '${{ matrix.loader }}' '${{ steps.tag_version.outputs.mod_version }}'

      - name: Set up Java ${{ steps.versions.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Pin Gradle and loader toolchains to selected Java
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-download=false" >> "${GITHUB_ENV}"
          {
            echo "org.gradle.java.installations.paths=${JAVA_HOME}"
            echo "org.gradle.java.installations.auto-download=false"
          } >> gradle.properties
          java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print Gradle profile
        shell: bash
        run: ./gradlew "-PmcProfile=${{ steps.versions.outputs.mc_profile }}" "-PtargetLoader=none" "-PmodVersion=${{ steps.tag_version.outputs.mod_version }}" printBuildProfile --stacktrace

      - name: Build loader jar
        shell: bash
        run: ./gradlew "-PmcProfile=${{ steps.versions.outputs.mc_profile }}" "-PtargetLoader=${{ steps.versions.outputs.loader }}" "-PmodVersion=${{ steps.tag_version.outputs.mod_version }}" clean ${{ steps.versions.outputs.gradle_task }} --stacktrace

      - name: Validate jar metadata
        shell: bash
        run: |
          python3 -B scripts/validate-jar-metadata.py \
            --loader '${{ steps.versions.outputs.loader }}' \
            --minecraft-version '${{ steps.versions.outputs.minecraft_version }}' \
            --mod-version '${{ steps.versions.outputs.mod_version }}' \
            --jar '${{ steps.versions.outputs.jar_path }}'

      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp '${{ steps.versions.outputs.jar_path }}' "${OUT}/"
          (
            cd "${OUT}"
            sha256sum '${{ steps.versions.outputs.jar_name }}' > '${{ steps.versions.outputs.jar_name }}.sha256'
          )

          cat > "${OUT}/${{ steps.versions.outputs.jar_name }}.metadata.json" <<JSON
          {
            "mod": "RealtimeSync",
            "modVersion": "${{ steps.versions.outputs.mod_version }}",
            "minecraftVersion": "${{ steps.versions.outputs.minecraft_version }}",
            "minecraftProfile": "${{ steps.versions.outputs.mc_profile }}",
            "loader": "${{ steps.versions.outputs.loader }}",
            "loaderName": "${{ steps.versions.outputs.loader_title }}",
            "java": "${{ steps.versions.outputs.java_version }}",
            "jar": "${{ steps.versions.outputs.jar_name }}"
          }
          JSON

          find "${OUT}" -maxdepth 1 -type f -print -exec ls -lah {} \;

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/*

  github-release:
    name: Publish GitHub release artifacts
    runs-on: ubuntu-latest
    needs:
      - build-loader
      - prepare-matrix
    if: ${{ github.ref_type == 'tag' && needs.build-loader.result == 'success' && needs.prepare-matrix.outputs.has_entries == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Verify Changelog
        shell: bash
        run: |
          test -s CHANGELOG.md
          cat CHANGELOG.md

      - name: Download all loader artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: realtime-sync-*-jar
          path: release-jars
          merge-multiple: true

      - name: List release files
        shell: bash
        run: |
          test -n "$(find release-jars -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find release-jars -maxdepth 1 -type f -print | sort

      - name: Publish GitHub Release files
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: release-jars/*
          body_path: CHANGELOG.md

  curseforge-publish:
    name: Publish ${{ matrix.loader }} for Minecraft ${{ matrix.mc_profile }} to CurseForge
    runs-on: ubuntu-latest
    needs:
      - build-loader
      - prepare-matrix
    if: ${{ github.ref_type == 'tag' && needs.build-loader.result == 'success' && needs.prepare-matrix.outputs.has_entries == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version from tag
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
            exit 1
          fi
          MOD_VERSION="${TAG#v}"
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "Could not resolve mod version from tag ${TAG}" >&2
            exit 1
          fi
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "MOD_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"

      - name: Read selected build profile and loader
        id: versions
        shell: bash
        run: bash scripts/ci-read-profile.sh '${{ matrix.mc_profile }}' '${{ matrix.loader }}' '${{ steps.tag_version.outputs.mod_version }}'

      - name: Download loader artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: publish-artifact

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Publish loader file to CurseForge
        if: env.CURSEFORGE_PROJECT_ID != '' && env.CURSEFORGE_TOKEN != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: publish-artifact/${{ steps.versions.outputs.jar_name }}
          name: RealtimeSync ${{ steps.versions.outputs.mod_version }} [Minecraft ${{ steps.versions.outputs.minecraft_compat_label }}] ${{ steps.versions.outputs.loader_title }}
          version: ${{ steps.versions.outputs.loader }}-${{ steps.versions.outputs.mod_version }}+mc${{ steps.versions.outputs.minecraft_compat_label }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            ${{ steps.versions.outputs.curseforge_loader }}
          game-versions: |
            ${{ steps.versions.outputs.curseforge_game_versions }}
          game-version-filter: none
          java: |
            ${{ steps.versions.outputs.curseforge_java_versions }}
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: fail

      - name: CurseForge credentials not configured
        if: env.CURSEFORGE_PROJECT_ID == '' || env.CURSEFORGE_TOKEN == ''
        shell: bash
        run: |
          echo "Skipping CurseForge publish because CURSEFORGE_PROJECT_ID or CURSEFORGE_TOKEN is not configured."
