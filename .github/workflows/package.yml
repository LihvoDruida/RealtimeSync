name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realtime-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

jobs:
  validate:
    name: Validate build matrix and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle wrapper executable bit
        shell: bash
        run: |
          chmod +x ./gradlew
          git update-index --chmod=+x ./gradlew || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify build matrix guardrails
        shell: bash
        run: bash scripts/verify-build-matrix.sh

  build-loader:
    name: Build ${{ matrix.loader }} for Minecraft ${{ matrix.mc_profile }}
    runs-on: ubuntu-latest
    needs: validate
    env:
      TARGET_LOADER: ${{ matrix.loader }}
    strategy:
      fail-fast: false
      matrix:
        mc_profile:
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
        loader:
          - fabric
          - quilt
          - forge
          - neoforge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Gradle wrapper executable bit
        shell: bash
        run: |
          chmod +x ./gradlew
          git update-index --chmod=+x ./gradlew || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pin Gradle and Forge toolchains to Java 21
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME} -Dorg.gradle.java.installations.auto-download=false" >> "${GITHUB_ENV}"
          {
            echo "org.gradle.java.installations.paths=${JAVA_HOME}"
            echo "org.gradle.java.installations.auto-download=false"
          } >> gradle.properties
          java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version from tag
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != v* ]]; then
              echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
              exit 1
            fi
            MOD_VERSION="${TAG#v}"
          else
            MOD_VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          if [[ -z "${MOD_VERSION}" ]]; then
            echo "Could not resolve mod version. Expected tag format like v1.5.5" >&2
            exit 1
          fi

          sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties

          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved mod version: ${MOD_VERSION}"
          grep '^mod_version=' gradle.properties

      - name: Read selected build profile and loader
        id: versions
        shell: bash
        run: bash scripts/ci-read-profile.sh '${{ matrix.mc_profile }}' '${{ matrix.loader }}'

      - name: Skip disabled loader
        if: steps.versions.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "Skipping ${{ steps.versions.outputs.loader_title }} for Minecraft ${{ steps.versions.outputs.minecraft_version }} because ${{ steps.versions.outputs.enable_key }}=false."

      - name: Print Gradle profile
        if: steps.versions.outputs.enabled == 'true'
        shell: bash
        run: bash ./gradlew -PmcProfile=${{ steps.versions.outputs.mc_profile }} -PtargetLoader=none printBuildProfile --stacktrace

      - name: Build loader jar
        if: steps.versions.outputs.enabled == 'true'
        shell: bash
        run: bash ./gradlew -PmcProfile=${{ steps.versions.outputs.mc_profile }} -PtargetLoader=${{ steps.versions.outputs.loader }} clean ${{ steps.versions.outputs.gradle_task }} --stacktrace

      - name: Validate jar metadata
        if: steps.versions.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 scripts/validate-jar-metadata.py \
            --loader '${{ steps.versions.outputs.loader }}' \
            --minecraft-version '${{ steps.versions.outputs.minecraft_version }}' \
            --mod-version '${{ steps.versions.outputs.mod_version }}' \
            --jar '${{ steps.versions.outputs.jar_path }}'

      - name: Stage release artifact
        if: steps.versions.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp '${{ steps.versions.outputs.jar_path }}' "${OUT}/"
          (
            cd "${OUT}"
            sha256sum '${{ steps.versions.outputs.jar_name }}' > '${{ steps.versions.outputs.jar_name }}.sha256'
          )

          cat > "${OUT}/${{ steps.versions.outputs.jar_name }}.metadata.json" <<JSON
          {
            "mod": "RealtimeSync",
            "modVersion": "${{ steps.versions.outputs.mod_version }}",
            "minecraftVersion": "${{ steps.versions.outputs.minecraft_version }}",
            "minecraftProfile": "${{ steps.versions.outputs.mc_profile }}",
            "loader": "${{ steps.versions.outputs.loader }}",
            "loaderName": "${{ steps.versions.outputs.loader_title }}",
            "java": "${{ steps.versions.outputs.java_version }}",
            "jar": "${{ steps.versions.outputs.jar_name }}"
          }
          JSON

          find "${OUT}" -maxdepth 1 -type f -print -exec ls -lah {} \;

      - name: Upload loader artifact
        if: steps.versions.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/*

  github-release:
    name: Publish GitHub release artifacts
    runs-on: ubuntu-latest
    needs: build-loader
    if: ${{ always() && github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Verify Changelog
        shell: bash
        run: |
          test -s CHANGELOG.md
          cat CHANGELOG.md

      - name: Download all loader artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: realtime-sync-*-jar
          path: release-jars
          merge-multiple: true

      - name: List release files
        shell: bash
        run: |
          test -n "$(find release-jars -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find release-jars -maxdepth 1 -type f -print | sort

      - name: Publish GitHub Release files
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: release-jars/*
          body_path: CHANGELOG.md

  curseforge-publish:
    name: Publish ${{ matrix.loader }} for Minecraft ${{ matrix.mc_profile }} to CurseForge
    runs-on: ubuntu-latest
    needs: build-loader
    if: ${{ always() && github.ref_type == 'tag' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mc_profile:
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
        loader:
          - fabric
          - quilt
          - forge
          - neoforge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version from tag
        id: tag_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "This workflow tag must use v* format. Current tag: ${TAG}" >&2
            exit 1
          fi
          MOD_VERSION="${TAG#v}"
          sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read selected build profile and loader
        id: versions
        shell: bash
        run: bash scripts/ci-read-profile.sh '${{ matrix.mc_profile }}' '${{ matrix.loader }}'

      - name: Skip disabled loader
        if: steps.versions.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "Skipping CurseForge publish for disabled loader: ${{ steps.versions.outputs.loader_title }} Minecraft ${{ steps.versions.outputs.minecraft_version }}."

      - name: Download loader artifact
        if: steps.versions.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: publish-artifact

      - name: Generate CHANGELOG.md
        if: steps.versions.outputs.enabled == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Publish loader file to CurseForge
        if: steps.versions.outputs.enabled == 'true' && env.CURSEFORGE_PROJECT_ID != '' && env.CURSEFORGE_TOKEN != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: publish-artifact/${{ steps.versions.outputs.jar_name }}
          name: RealtimeSync ${{ steps.versions.outputs.mod_version }} [Minecraft ${{ steps.versions.outputs.minecraft_compat_label }}] ${{ steps.versions.outputs.loader_title }}
          version: ${{ steps.versions.outputs.loader }}-${{ steps.versions.outputs.mod_version }}+mc${{ steps.versions.outputs.minecraft_compat_label }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            ${{ steps.versions.outputs.curseforge_loader }}
          game-versions: |
            ${{ steps.versions.outputs.curseforge_game_versions }}
          game-version-filter: none
          java: |
            ${{ steps.versions.outputs.curseforge_java_versions }}
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: warn

      - name: CurseForge credentials not configured
        if: steps.versions.outputs.enabled == 'true' && (env.CURSEFORGE_PROJECT_ID == '' || env.CURSEFORGE_TOKEN == '')
        shell: bash
        run: |
          echo "Skipping CurseForge publish because CURSEFORGE_PROJECT_ID or CURSEFORGE_TOKEN is not configured."
