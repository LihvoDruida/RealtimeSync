plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.8' apply false
    id 'net.minecraftforge.gradle' version '7.0.25' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

import java.util.Properties

ext.loadMinecraftProfile = {
    String requestedProfile = (findProperty('mcProfile') ?: System.getenv('MC_PROFILE') ?: findProperty('minecraft_version') ?: '26.1.2').toString()
    File profileFile = rootProject.file("buildProfiles/${requestedProfile}.properties")

    Properties loaded = new Properties()
    if (profileFile.isFile()) {
        profileFile.withInputStream { loaded.load(it) }
    } else {
        throw new GradleException("Minecraft build profile '${requestedProfile}' was not found at ${profileFile}. Add buildProfiles/${requestedProfile}.properties or use a supported -PmcProfile value.")
    }

    loaded.setProperty('mcProfile', requestedProfile)
    loaded.setProperty('minecraft_profile', requestedProfile)
    loaded.setProperty('profile_file', profileFile.path)

    return loaded
}

ext.boolProfileProperty = { String key, boolean fallback = true ->
    if (!rootProject.ext.has(key)) {
        return fallback
    }
    return rootProject.ext.get(key).toString().toBoolean()
}

ext.stringProfileProperty = { String key, String fallback = '' ->
    if (!rootProject.ext.has(key)) {
        return fallback
    }
    return rootProject.ext.get(key).toString().trim()
}

ext.betaCompatibleLowerBound = { String minimumVersion, boolean acceptBeta, String displayName ->
    String value = minimumVersion == null ? '' : minimumVersion.toString().trim()
    if (value.isEmpty()) {
        throw new GradleException("Missing ${displayName} minimum version in the selected build profile.")
    }
    return acceptBeta && !value.contains('-') ? "${value}-0-beta" : value
}

ext.isLoaderEnabled = { String loader ->
    return rootProject.ext.boolProfileProperty("enable_${loader}".toString(), true)
}

ext.resolveMinecraftVersionRangeParts = {
    String minimumVersion = rootProject.ext.stringProfileProperty('minecraft_runtime_min_version', rootProject.ext.stringProfileProperty('minecraft_version'))
    String maximumVersion = rootProject.ext.stringProfileProperty('minecraft_runtime_max_version')
    if (maximumVersion.isEmpty()) {
        throw new GradleException('Missing Minecraft runtime maximum version. Set minecraft_runtime_max_version in the build profile.')
    }

    boolean acceptBeta = rootProject.ext.boolProfileProperty('minecraft_accept_beta', false)
    String lowerBound = rootProject.ext.betaCompatibleLowerBound(minimumVersion, acceptBeta, 'Minecraft runtime')
    return [lowerBound, maximumVersion]
}

ext.resolveMinecraftVersionRangeFabric = {
    String explicitRange = rootProject.ext.stringProfileProperty('minecraft_version_range_fabric')
    if (!explicitRange.isEmpty()) {
        return explicitRange
    }

    List<String> bounds = rootProject.ext.resolveMinecraftVersionRangeParts()
    return ">=${bounds[0]} <${bounds[1]}"
}

ext.resolveMinecraftVersionRangeModsToml = {
    String explicitRange = rootProject.ext.stringProfileProperty('minecraft_version_range_mods_toml')
    if (!explicitRange.isEmpty()) {
        return explicitRange
    }

    List<String> bounds = rootProject.ext.resolveMinecraftVersionRangeParts()
    return "[${bounds[0]},${bounds[1]})"
}

ext.resolveNeoForgeVersionRange = {
    String explicitRange = rootProject.ext.stringProfileProperty('neoforge_version_range')
    if (!explicitRange.isEmpty()) {
        return explicitRange
    }

    String minimumVersion = rootProject.ext.stringProfileProperty('neoforge_runtime_min_version', rootProject.ext.stringProfileProperty('minecraft_version'))
    boolean acceptBeta = rootProject.ext.boolProfileProperty('neoforge_accept_beta', true)
    String lowerBound = rootProject.ext.betaCompatibleLowerBound(minimumVersion, acceptBeta, 'NeoForge runtime')
    return "[${lowerBound},)"
}

ext.loaderTaskOrSkip = { String taskName, String loaderName, String targetPath ->
    tasks.register(taskName) {
        group = 'build'
        description = "Builds the ${loaderName} jar for the selected Minecraft profile when supported."

        String loaderKey = loaderName.toLowerCase(Locale.ROOT)
        boolean loaderEnabled = rootProject.ext.isLoaderEnabled(loaderKey)
        boolean projectIncluded = rootProject.findProject(":${loaderKey}") != null

        if (loaderEnabled && projectIncluded) {
            dependsOn targetPath
        } else {
            doLast {
                if (!loaderEnabled) {
                    logger.lifecycle("Skipping ${loaderName} for Minecraft ${rootProject.ext.minecraft_version}: profile disables enable_${loaderKey}.")
                } else {
                    logger.lifecycle("Skipping ${loaderName}: project :${loaderKey} is not included for targetLoader=${findProperty('targetLoader') ?: System.getenv('TARGET_LOADER') ?: 'all'}.")
                }
            }
        }
    }
}

def minecraftProfileProperties = loadMinecraftProfile()

allprojects {
    minecraftProfileProperties.each { key, value ->
        extensions.extraProperties.set(key.toString(), value.toString())
    }

    extensions.extraProperties.set('minecraft_version_range_fabric', rootProject.ext.resolveMinecraftVersionRangeFabric())
    extensions.extraProperties.set('minecraft_version_range_mods_toml', rootProject.ext.resolveMinecraftVersionRangeModsToml())

    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (findProperty('java_version') ?: '21') as int
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)
        })
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.register('printBuildProfile') {
    group = 'help'
    description = 'Prints the resolved Minecraft build profile used by Gradle.'
    doLast {
        println "mcProfile=${rootProject.ext.mcProfile}"
        println "minecraft_version=${rootProject.ext.minecraft_version}"
        println "minecraft_compat_label=${rootProject.ext.minecraft_compat_label}"
        println "minecraft_runtime_min_version=${rootProject.ext.minecraft_runtime_min_version}"
        println "minecraft_runtime_max_version=${rootProject.ext.minecraft_runtime_max_version}"
        println "minecraft_accept_beta=${rootProject.ext.minecraft_accept_beta}"
        println "minecraft_version_range_fabric=${rootProject.ext.resolveMinecraftVersionRangeFabric()}"
        println "minecraft_version_range_mods_toml=${rootProject.ext.resolveMinecraftVersionRangeModsToml()}"
        println "java_version=${rootProject.ext.java_version}"
        println "fabric_loader_version=${rootProject.ext.loader_version}"
        println "fabric_version=${rootProject.ext.fabric_version}"
        println "forge_version=${rootProject.ext.forge_version}"
        println "neoforge_version=${rootProject.ext.neoforge_version}"
        println "neoforge_runtime_min_version=${rootProject.ext.neoforge_runtime_min_version}"
        println "neoforge_accept_beta=${rootProject.ext.neoforge_accept_beta}"
        println "neoforge_version_range=${rootProject.ext.resolveNeoForgeVersionRange()}"
        println "enable_fabric=${rootProject.ext.isLoaderEnabled('fabric')}"
        println "enable_quilt=${rootProject.ext.isLoaderEnabled('quilt')}"
        println "enable_forge=${rootProject.ext.isLoaderEnabled('forge')}"
        println "enable_neoforge=${rootProject.ext.isLoaderEnabled('neoforge')}"
    }
}

loaderTaskOrSkip('buildFabric', 'Fabric', ':fabric:build')
loaderTaskOrSkip('buildQuilt', 'Quilt', ':quilt:build')
loaderTaskOrSkip('buildForge', 'Forge', ':forge:build')
loaderTaskOrSkip('buildNeoForge', 'NeoForge', ':neoforge:build')

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds every enabled loader jar for the selected Minecraft profile.'
    dependsOn 'buildFabric', 'buildQuilt', 'buildForge', 'buildNeoForge'
}
