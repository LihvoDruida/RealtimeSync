plugins {
    id 'fabric-loom' version '1.15.5' apply false
    id 'net.minecraftforge.gradle' version '7.0.25' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

import java.util.Properties

ext.loadMinecraftProfile = {
    String requestedProfile = (findProperty('mcProfile') ?: System.getenv('MC_PROFILE') ?: findProperty('minecraft_version') ?: '1.21.5').toString()
    File profileFile = rootProject.file("buildProfiles/${requestedProfile}.properties")

    Properties loaded = new Properties()
    if (profileFile.isFile()) {
        profileFile.withInputStream { loaded.load(it) }
    } else {
        logger.warn("Minecraft build profile '${requestedProfile}' was not found at ${profileFile}. Falling back to gradle.properties values.")
    }

    loaded.setProperty('mcProfile', requestedProfile)
    loaded.setProperty('minecraft_profile', requestedProfile)
    loaded.setProperty('profile_file', profileFile.path)

    return loaded
}

ext.boolProfileProperty = { String key, boolean fallback = true ->
    if (!rootProject.ext.has(key)) {
        return fallback
    }
    return rootProject.ext.get(key).toString().toBoolean()
}

ext.isLoaderEnabled = { String loader ->
    return rootProject.ext.boolProfileProperty("enable_${loader}".toString(), true)
}

ext.loaderTaskOrSkip = { String taskName, String loaderName, String targetPath ->
    tasks.register(taskName) {
        group = 'build'
        description = "Builds the ${loaderName} jar for the selected Minecraft profile when supported."
        if (rootProject.ext.isLoaderEnabled(loaderName.toLowerCase())) {
            dependsOn targetPath
        } else {
            doLast {
                logger.lifecycle("Skipping ${loaderName} for Minecraft ${rootProject.ext.minecraft_version}: profile disables enable_${loaderName.toLowerCase()}.")
            }
        }
    }
}

def minecraftProfileProperties = loadMinecraftProfile()

allprojects {
    minecraftProfileProperties.each { key, value ->
        extensions.extraProperties.set(key.toString(), value.toString())
    }

    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (findProperty('java_version') ?: '21') as int
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.register('printBuildProfile') {
    group = 'help'
    description = 'Prints the resolved Minecraft build profile used by Gradle.'
    doLast {
        println "mcProfile=${rootProject.ext.mcProfile}"
        println "minecraft_version=${rootProject.ext.minecraft_version}"
        println "minecraft_compat_label=${rootProject.ext.minecraft_compat_label}"
        println "minecraft_version_range_fabric=${rootProject.ext.minecraft_version_range_fabric}"
        println "minecraft_version_range_mods_toml=${rootProject.ext.minecraft_version_range_mods_toml}"
        println "java_version=${rootProject.ext.java_version}"
        println "fabric_loader_version=${rootProject.ext.loader_version}"
        println "fabric_version=${rootProject.ext.fabric_version}"
        println "forge_version=${rootProject.ext.forge_version}"
        println "neoforge_version=${rootProject.ext.neoforge_version}"
        println "enable_fabric=${rootProject.ext.isLoaderEnabled('fabric')}"
        println "enable_quilt=${rootProject.ext.isLoaderEnabled('quilt')}"
        println "enable_forge=${rootProject.ext.isLoaderEnabled('forge')}"
        println "enable_neoforge=${rootProject.ext.isLoaderEnabled('neoforge')}"
    }
}

loaderTaskOrSkip('buildFabric', 'Fabric', ':fabric:build')
loaderTaskOrSkip('buildQuilt', 'Quilt', ':quilt:build')
loaderTaskOrSkip('buildForge', 'Forge', ':forge:build')
loaderTaskOrSkip('buildNeoForge', 'NeoForge', ':neoforge:build')

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds every enabled loader jar for the selected Minecraft profile.'
    dependsOn 'buildFabric', 'buildQuilt', 'buildForge', 'buildNeoForge'
}
