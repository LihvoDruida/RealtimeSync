plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'net.minecraftforge.gradle' version '7.0.25' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

import java.util.Properties

ext.loadMinecraftProfile = {
    // Read the command-line value directly before consulting gradle.properties.
    // This avoids accidental shadowing/coercion by extra properties or plugins.
    String cliProfile = gradle.startParameter.projectProperties.get('mcProfile')
    String envProfile = System.getenv('MC_PROFILE')
    String configuredProfile = providers.gradleProperty('mcProfile').orNull
    String legacyProfile = providers.gradleProperty('minecraft_version').orNull

    def candidates = [
            [source: '-PmcProfile', value: cliProfile],
            [source: 'MC_PROFILE', value: envProfile],
            [source: 'gradle.properties mcProfile', value: configuredProfile],
            [source: 'minecraft_version fallback', value: legacyProfile],
            [source: 'built-in default', value: '1.21.5']
    ]
    def selected = candidates.find { entry -> entry.value != null && !entry.value.toString().trim().isEmpty() }
    String requestedProfile = selected.value.toString().trim()
    String profileSource = selected.source.toString()

    if (!(requestedProfile ==~ /1\.21(?:\.(?:[1-9]|10|11))?/)) {
        throw new GradleException(
                "Invalid Minecraft build profile '${requestedProfile}' from ${profileSource}. " +
                "Expected one of the explicit 1.21.x profile names such as 1.21, 1.21.5 or 1.21.11. " +
                "On PowerShell prefer: .\\scripts\\build.ps1 -Profile 1.21.11 -Loader neoforge"
        )
    }

    File profileFile = rootProject.file("buildProfiles/${requestedProfile}.properties")
    Properties loaded = new Properties()
    if (profileFile.isFile()) {
        profileFile.withReader('UTF-8') { loaded.load(it) }
    } else {
        def supportedProfiles = rootProject.file('buildProfiles')
                .listFiles({ File file -> file.name.endsWith('.properties') } as FileFilter)
                ?.collect { it.name.substring(0, it.name.length() - '.properties'.length()) }
                ?.sort { value -> value.tokenize('.').collect { String.format('%04d', it as int) }.join('.') }
                ?: []
        throw new GradleException(
                "Minecraft build profile '${requestedProfile}' from ${profileSource} was not found at ${profileFile}. " +
                "Supported profiles: ${supportedProfiles.join(', ')}"
        )
    }

    loaded.setProperty('mcProfile', requestedProfile)
    loaded.setProperty('minecraft_profile', requestedProfile)
    loaded.setProperty('mc_profile_source', profileSource)
    loaded.setProperty('profile_file', profileFile.path)
    return loaded
}

ext.boolProfileProperty = { String key, boolean fallback = true ->
    if (!rootProject.ext.has(key)) {
        return fallback
    }
    return rootProject.ext.get(key).toString().toBoolean()
}

ext.isLoaderEnabled = { String loader ->
    return rootProject.ext.boolProfileProperty("enable_${loader}".toString(), true)
}

ext.loaderTaskOrSkip = { String taskName, String loaderName, String targetPath ->
    tasks.register(taskName) {
        group = 'build'
        description = "Builds the ${loaderName} jar for the selected Minecraft profile when supported."

        String loaderKey = loaderName.toLowerCase(Locale.ROOT)
        boolean loaderEnabled = rootProject.ext.isLoaderEnabled(loaderKey)
        boolean projectIncluded = rootProject.findProject(":${loaderKey}") != null

        if (loaderEnabled && projectIncluded) {
            dependsOn targetPath
        } else {
            doLast {
                if (!loaderEnabled) {
                    logger.lifecycle("Skipping ${loaderName} for Minecraft ${rootProject.ext.minecraft_version}: profile disables enable_${loaderKey}.")
                } else {
                    logger.lifecycle("Skipping ${loaderName}: project :${loaderKey} is not included for targetLoader=${gradle.ext.has('resolvedTargetLoader') ? gradle.ext.resolvedTargetLoader : 'all'}.")
                }
            }
        }
    }
}

ext.readGitRevision = {
    File gitDirectory = rootProject.file('.git')
    File headFile = new File(gitDirectory, 'HEAD')
    if (!headFile.isFile()) {
        return null
    }

    String head = headFile.getText('UTF-8').trim()
    String revision = head
    if (head.startsWith('ref: ')) {
        String reference = head.substring('ref: '.length()).trim()
        File looseReference = new File(gitDirectory, reference)
        if (looseReference.isFile()) {
            revision = looseReference.getText('UTF-8').trim()
        } else {
            File packedReferences = new File(gitDirectory, 'packed-refs')
            revision = packedReferences.isFile()
                    ? packedReferences.readLines('UTF-8')
                    .find { line -> !line.startsWith('#') && !line.startsWith('^') && line.endsWith(" ${reference}") }
                    ?.tokenize(' ')
                    ?.first()
                    : null
        }
    }
    return revision != null && revision ==~ /[0-9a-fA-F]{7,40}/
            ? revision.substring(0, Math.min(8, revision.length())).toLowerCase(Locale.ROOT)
            : null
}

ext.resolveModVersion = {
    String cliVersion = gradle.startParameter.projectProperties.get('modVersion')
            ?: gradle.startParameter.projectProperties.get('mod_version')
    String envVersion = System.getenv('MOD_VERSION')
    String configuredVersion = providers.gradleProperty('mod_version').orNull

    def candidates = [
            [source: '-PmodVersion/-Pmod_version', value: cliVersion],
            [source: 'MOD_VERSION', value: envVersion],
            [source: 'gradle.properties mod_version', value: configuredVersion],
            [source: 'built-in local fallback', value: '0.0.0-dev']
    ]
    def selected = candidates.find { entry -> entry.value != null && !entry.value.toString().trim().isEmpty() }
    String resolved = selected.value.toString().trim()
    String source = selected.source.toString()

    if (resolved == '0.0.0-dev') {
        String revision = rootProject.ext.readGitRevision()
        resolved = "0.0.0-dev+${revision ?: 'local'}"
        source = revision == null ? 'local source fallback' : 'Git revision fallback'
    }
    if (!(resolved ==~ /[0-9A-Za-z][0-9A-Za-z._+-]*/)) {
        throw new GradleException(
                "Invalid mod version '${resolved}' from ${source}. " +
                "Use letters, digits, dots, underscores, plus signs and hyphens only. " +
                "Example: -PmodVersion=1.4.1"
        )
    }
    return [version: resolved, source: source]
}

def minecraftProfileProperties = loadMinecraftProfile()
def resolvedModVersion = resolveModVersion()
minecraftProfileProperties.setProperty('mod_version', resolvedModVersion.version.toString())
minecraftProfileProperties.setProperty('mod_version_source', resolvedModVersion.source.toString())

// Every loader expands common resources such as realtime-build.properties.
// Keep the shared placeholders in one canonical map so a loader-specific
// processResources block cannot accidentally omit minecraft_version again.
ext.resourceExpansionValues = { String loaderName, Map extraValues = [:] ->
    LinkedHashMap<String, String> values = new LinkedHashMap<>()
    values.put('version', rootProject.ext.mod_version.toString())
    values.put('minecraft_version', rootProject.ext.minecraft_version.toString())
    values.put('minecraft_profile', rootProject.ext.mcProfile.toString())
    values.put('loader', loaderName)

    extraValues.each { key, value ->
        if (value == null) {
            throw new GradleException("Resource expansion value '${key}' for loader '${loaderName}' is null.")
        }
        values.put(key.toString(), value.toString())
    }
    return java.util.Collections.unmodifiableMap(values)
}

allprojects {
    minecraftProfileProperties.each { key, value ->
        extensions.extraProperties.set(key.toString(), value.toString())
    }

    group = project.maven_group
    version = project.mod_version
}

def profileCompatibilitySource = minecraftProfileProperties.getProperty('minecraft_version') == '1.21.11'
        ? 'common/src/mc12111/java'
        : 'common/src/mc121legacy/java'

subprojects {
    apply plugin: 'java'

    sourceSets.main.java.srcDir(rootProject.file(profileCompatibilitySource))

    java {
        toolchain.languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (findProperty('java_version') ?: '21') as int
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of((findProperty('java_version') ?: '21') as int)
        })
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}



tasks.register('listBuildProfiles') {
    group = 'help'
    description = 'Lists all explicit Minecraft build profiles available in buildProfiles/.'
    doLast {
        rootProject.file('buildProfiles')
                .listFiles({ File file -> file.name.endsWith('.properties') } as FileFilter)
                .collect { it.name.substring(0, it.name.length() - '.properties'.length()) }
                .sort { value -> value.tokenize('.').collect { String.format('%04d', it as int) }.join('.') }
                .each { println it }
    }
}
tasks.register('printBuildProfile') {
    group = 'help'
    description = 'Prints the resolved Minecraft build profile used by Gradle.'
    doLast {
        println "mcProfile=${rootProject.ext.mcProfile}"
        println "mcProfileSource=${rootProject.ext.mc_profile_source}"
        println "targetLoader=${gradle.ext.has('resolvedTargetLoader') ? gradle.ext.resolvedTargetLoader : 'all'}"
        println "mod_version=${rootProject.ext.mod_version}"
        println "modVersionSource=${rootProject.ext.mod_version_source}"
        println "minecraft_version=${rootProject.ext.minecraft_version}"
        println "minecraft_compat_label=${rootProject.ext.minecraft_compat_label}"
        println "minecraft_version_range_fabric=${rootProject.ext.minecraft_version_range_fabric}"
        println "minecraft_version_range_mods_toml=${rootProject.ext.minecraft_version_range_mods_toml}"
        println "java_version=${rootProject.ext.java_version}"
        println "fabric_loader_version=${rootProject.ext.loader_version}"
        println "fabric_version=${rootProject.ext.fabric_version}"
        println "forge_version=${rootProject.ext.forge_version}"
        println "forge_event_api=${rootProject.ext.forge_event_api}"
        println "neoforge_version=${rootProject.ext.neoforge_version}"
        println "enable_fabric=${rootProject.ext.isLoaderEnabled('fabric')}"
        println "enable_quilt=${rootProject.ext.isLoaderEnabled('quilt')}"
        println "enable_forge=${rootProject.ext.isLoaderEnabled('forge')}"
        println "enable_neoforge=${rootProject.ext.isLoaderEnabled('neoforge')}"
    }
}

loaderTaskOrSkip('buildFabric', 'Fabric', ':fabric:build')
loaderTaskOrSkip('buildQuilt', 'Quilt', ':quilt:build')
loaderTaskOrSkip('buildForge', 'Forge', ':forge:build')
loaderTaskOrSkip('buildNeoForge', 'NeoForge', ':neoforge:build')

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds every enabled loader jar for the selected Minecraft profile.'
    dependsOn 'buildFabric', 'buildQuilt', 'buildForge', 'buildNeoForge'
}
