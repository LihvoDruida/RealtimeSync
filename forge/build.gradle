plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('forge')) {
    logger.lifecycle("Skipping :forge: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.minecraftforge.gradle'

def archiveBaseName = "${archives_base_name}-forge-${minecraft_version}"
def resourceValues = [
        version: version.toString(),
        forge_loader_version: forge_loader_version.toString(),
        minecraft_version_range: minecraft_version_range_mods_toml.toString()
]
def licenseArchiveName = "LICENSE_${archiveBaseName}"
def implementationVersion = version.toString()
def implementationTitle = name.toString()

base {
    archivesName = archiveBaseName
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir.convention(layout.projectDirectory.dir('run'))
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

tasks.named('processResources', ProcessResources) {
    inputs.properties resourceValues
    filesMatching('META-INF/mods.toml') {
        expand(resourceValues)
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { licenseArchiveName }
    }
    manifest {
        attributes([
                'Specification-Title'    : 'RealtimeSync',
                'Specification-Vendor'   : 'melles1991',
                'Specification-Version'  : implementationVersion,
                'Implementation-Title'   : implementationTitle,
                'Implementation-Version' : implementationVersion,
                'Implementation-Vendor'  : 'melles1991'
        ])
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archiveBaseName
            from components.java
        }
    }
}
