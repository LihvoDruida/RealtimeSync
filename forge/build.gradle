plugins {
    id 'maven-publish'
}

if (!rootProject.ext.isLoaderEnabled('forge')) {
    logger.lifecycle("Skipping :forge: project is disabled for Minecraft ${rootProject.ext.minecraft_version} by buildProfiles/${rootProject.ext.mcProfile}.properties")
    tasks.configureEach { enabled = false }
    return
}

apply plugin: 'net.minecraftforge.gradle'

base {
    archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

repositories {
    // ForgeGradle 7 exposes these repository helpers after the plugin is applied.
    // They avoid missing userdev/Minecraft library artifacts on newer 1.21.x lines.
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            // ForgeGradle 7 uses the workingDir property. The old workingDirectory(...)
            // method from older MDKs fails on SlimeLauncherOptionsImpl.
            workingDir.convention(layout.projectDirectory.dir('run'))
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

dependencies {
    // ForgeGradle 7 resolves userdev through minecraft.dependency(...), not the old
    // minecraft configuration notation used by ForgeGradle 6-era MDKs.
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'forge_loader_version', project.forge_loader_version
    inputs.property 'minecraft_version_range_mods_toml', project.minecraft_version_range_mods_toml
    filesMatching('META-INF/mods.toml') {
        expand(
                version: project.version,
                forge_loader_version: project.forge_loader_version,
                minecraft_version_range: project.minecraft_version_range_mods_toml
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    manifest {
        attributes([
                'Specification-Title'     : 'RealtimeSync',
                'Specification-Vendor'    : 'melles1991',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'melles1991',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
