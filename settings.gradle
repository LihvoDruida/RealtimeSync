pluginManagement {
    repositories {
        // ForgeGradle 7 is published primarily through the Gradle Plugin Portal.
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MavenCentralRepo1'
            url = 'https://repo1.maven.org/maven2/'
            metadataSources {
                mavenPom()
                artifact()
                gradleMetadata()
            }
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    // Fabric Loom, ForgeGradle and NeoForge may add loader-specific project repositories.
    // FAIL_ON_PROJECT_REPOS breaks Loom with LoomLocalRemappedMods.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MavenCentralRepo1'
            url = 'https://repo1.maven.org/maven2/'
            metadataSources {
                mavenPom()
                artifact()
                gradleMetadata()
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'RealtimeSync'

// CI and local single-loader builds should configure only the requested loader.
// The explicit -PtargetLoader value wins. When it is omitted, infer the loader
// from buildFabric/buildQuilt/buildForge/buildNeoForge or :loader:task paths.
def supportedLoaders = ['fabric', 'quilt', 'forge', 'neoforge']
def requestedTasks = gradle.startParameter.taskNames.collect { it.toString() }
def normalizedTasks = requestedTasks.collect { it.replace('\\', '/').replaceFirst('^:', '').toLowerCase(Locale.ROOT) }
def rootOnlyTaskNames = ['printbuildprofile', 'listbuildprofiles', 'help', 'tasks', 'properties']
def rootOnlyProfileTask = !normalizedTasks.isEmpty() && normalizedTasks.every { taskName ->
    rootOnlyTaskNames.contains(taskName) || taskName == 'clean'
}

def loaderTaskNames = [
        fabric  : 'buildfabric',
        quilt   : 'buildquilt',
        forge   : 'buildforge',
        neoforge: 'buildneoforge'
]
def inferredLoaders = supportedLoaders.findAll { loader ->
    normalizedTasks.any { taskName ->
        taskName == loaderTaskNames[loader] ||
                taskName == "${loader}:build" ||
                taskName.startsWith("${loader}:")
    }
}

def explicitTargetLoader = gradle.startParameter.projectProperties.get('targetLoader')
        ?: System.getenv('TARGET_LOADER')
def targetLoader
if (explicitTargetLoader != null && !explicitTargetLoader.toString().trim().isEmpty()) {
    targetLoader = explicitTargetLoader.toString().trim().toLowerCase(Locale.ROOT)
} else if (normalizedTasks.contains('buildallloaders')) {
    targetLoader = 'all'
} else if (inferredLoaders.size() == 1) {
    targetLoader = inferredLoaders.first()
} else if (rootOnlyProfileTask) {
    targetLoader = 'none'
} else {
    targetLoader = 'all'
}

if (!((['all', 'none'] + supportedLoaders).contains(targetLoader))) {
    throw new GradleException("Unsupported targetLoader='${targetLoader}'. Use one of: all, none, ${supportedLoaders.join(', ')}")
}
if (targetLoader in supportedLoaders && !inferredLoaders.isEmpty() && !inferredLoaders.contains(targetLoader)) {
    throw new GradleException(
            "targetLoader='${targetLoader}' conflicts with requested task(s) ${requestedTasks}. " +
            "Use the matching loader or buildAllLoaders with -PtargetLoader=all."
    )
}

gradle.ext.resolvedTargetLoader = targetLoader

if (targetLoader == 'all') {
    supportedLoaders.each { include it }
} else if (targetLoader == 'none') {
    // Root-only Gradle invocation. Do not include loader projects.
} else {
    include targetLoader
}
